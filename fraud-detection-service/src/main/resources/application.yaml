spring:
  application:
    name: fraud-detection-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: fraud-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: "java.util,java.lang"
            use:
              type:
                headers: false
            value:
              default:
                type: java.util.HashMap
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

server:
  port: ${FRAUD_DETECTION_SERVICE_PORT:8084}

# Account service URL for Feign Client
account:
  service:
    url: ${ACCOUNT_SERVICE_URL:http://localhost:8081}

fraud:
  max-transactions-per-minute: ${MAX_TXN_PER_MINUTE:5}
  suspicious-amount-multiplier: ${SUSPICIOUS_ACC_MULTIPLIER:5}
  max-balance-percentage: ${MAX_BALANCE_PERCENTAGE:0.90}

management:
  endpoints:
    web:
      exposure:
        include: health,info